<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99, 102, 241, 0.08)" stroke-width="1" />
    </pattern>

    <!-- Accent Gradients -->
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes dashAnim {
        from { stroke-dashoffset: 2000; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.8; }
        50% { transform: translateY(-8px) scale(1.05); opacity: 1; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); transform-origin: 980px 180px; }
        100% { transform: rotate(360deg); transform-origin: 980px 180px; }
      }
      .anim-trend {
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: dashAnim 6s ease-in-out infinite alternate;
      }
      .anim-pulse {
        animation: floatPulse 4s ease-in-out infinite;
      }
      .anim-glow {
        animation: pulseGlow 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="140" fill="#ec4899" opacity="0.12" filter="url(#glow)" />
  <circle cx="700" cy="180" r="100" fill="#38bdf8" opacity="0.1" filter="url(#glow)" />

  <!-- Dynamic Forecast Chart Wave in Background/Midground (kept under foreground text) -->
  <g opacity="0.65">
    <!-- Area Fill -->
    <path d="M 0 320 Q 250 300 450 240 T 800 160 T 1050 110 T 1200 90 L 1200 360 L 0 360 Z" fill="url(#chartAreaGrad)" />
    <!-- Animated Prediction Trend Line -->
    <path class="anim-trend" d="M 0 320 Q 250 300 450 240 T 800 160 T 1050 110 T 1200 90" fill="none" stroke="url(#glowLine)" stroke-width="4" filter="url(#softGlow)" />
    <!-- Secondary Projected Confidence Cone -->
    <path d="M 750 175 L 1200 50 L 1200 130 Z" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-dasharray="6,6" />
    
    <!-- Data points / Nodes -->
    <circle cx="450" cy="240" r="5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="800" cy="160" r="6" fill="#818cf8" filter="url(#softGlow)" />
    <circle cx="1050" cy="110" r="7" fill="#ec4899" filter="url(#softGlow)" />
    <!-- Pulse ring on key projection node -->
    <circle class="anim-pulse" cx="1050" cy="110" r="14" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.7" />
  </g>

  <!-- High-Tech Background Decorative Badges / Floating Elements (Right Side) -->
  <g class="anim-pulse" transform="translate(930, 45)">
    <rect width="210" height="42" rx="21" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1.5" />
    <circle cx="22" cy="21" r="7" fill="#10b981" filter="url(#softGlow)" />
    <text x="40" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">FORECAST ACCURACY 95%+</text>
  </g>

  <g class="anim-pulse" transform="translate(960, 240)">
    <rect width="180" height="38" rx="19" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(236, 72, 153, 0.5)" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#ec4899" filter="url(#softGlow)" />
    <text x="36" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">REVENUE AI • RevOps</text>
  </g>

  <!-- Foreground Title and Core Content (Crisp, High Contrast, Perfectly Legible) -->
  <g transform="translate(70, 0)">
    <!-- Sub-heading Tagline Badge -->
    <g transform="translate(0, 68)">
      <rect width="320" height="28" rx="14" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(129, 140, 248, 0.5)" stroke-width="1" />
      <text x="16" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED REVENUE INTELLIGENCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Predictive AI &amp; Sales Forecasting
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="206" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
      The authoritative index of enterprise SaaS revenue platforms &amp; open-source ML models
    </text>
    
    <text x="0" y="234" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
      Pipeline Inspection • B2B Quota Cascades • Time-Series Projections • Deal Intelligence
    </text>

    <!-- Interactive/Tech Stack Pill Indicators -->
    <g transform="translate(0, 272)">
      <!-- Pill 1: Enterprise SaaS -->
      <rect x="0" y="0" width="130" height="32" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1" />
      <text x="16" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🏢 Enterprise SaaS</text>

      <!-- Pill 2: Open Source -->
      <rect x="142" y="0" width="130" height="32" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1" />
      <text x="158" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ Open Source</text>

      <!-- Pill 3: Machine Learning -->
      <rect x="284" y="0" width="165" height="32" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#ec4899" stroke-width="1" />
      <text x="300" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🤖 ML &amp; Time-Series</text>
    </g>
  </g>
</svg>
